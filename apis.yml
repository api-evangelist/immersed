name: Immersed
description: >-
  Immersed is a spatial-computing company that turns AR/VR headsets into portable
  multi-monitor workspaces for remote work, coding, and collaboration. Its free
  desktop agent streams up to five virtual screens into headsets such as Meta Quest,
  Apple Vision Pro, GalaxyXR, and Pico, adding solo focus environments plus multi-user
  telepresence with screen sharing and whiteboarding. Immersed is also building Visor,
  its own lightweight 4K-per-eye standalone headset. The company is Techstars-backed.
  Immersed publishes no public developer API, SDK, or developer portal; this profile
  captures its public web, product, security, and llms.txt surface for the API
  Evangelist network.
